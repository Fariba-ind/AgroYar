name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate database assets
        run: python3 tools/validate_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Lint, unit test, and build Android 10+ release APK
        run: gradle :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Verify APK archive, zip alignment, manifest, signing, and architecture independence
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -tq "$APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          test -x "$ZIPALIGN"

          "$ZIPALIGN" -c -v 4 "$APK"

          VERIFY_OUTPUT="$($APKSIGNER verify --verbose --print-certs "$APK")"
          echo "$VERIFY_OUTPUT"
          echo "$VERIFY_OUTPUT" | grep -q 'Verified using v1 scheme.*true'
          echo "$VERIFY_OUTPUT" | grep -q 'Verified using v2 scheme.*true'
          echo "$VERIFY_OUTPUT" | grep -q 'Verified using v3 scheme.*true'

          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | head -40
          echo "$BADGING" | grep -q "package: name='ir.agroyar.android'"
          echo "$BADGING" | grep -q "versionCode='100'"
          echo "$BADGING" | grep -q "versionName='1.0.0'"
          echo "$BADGING" | grep -q "sdkVersion:'23'"
          echo "$BADGING" | grep -q "targetSdkVersion:'35'"
          echo "$BADGING" | grep -q "launchable-activity: name='ir.agroyar.app.MainActivity'"

          if unzip -l "$APK" | grep -q ' lib/.*\.so'; then
            echo "Unexpected native libraries found" >&2
            unzip -l "$APK" | grep ' lib/.*\.so' >&2
            exit 1
          fi

          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256.txt

      - name: Upload final Android 10+ APK
        uses: actions/upload-artifact@v4
        with:
          name: AgroYar-1.0.0-Android10Plus
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256.txt
          if-no-files-found: error

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            arch: x86_64
          - api-level: 30
            arch: x86_64
          - api-level: 35
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: AgroYar-1.0.0-Android10Plus
          path: artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and exercise AgroYar from launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: ${{ matrix.arch }}
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator_smoke_test.sh artifacts/app-release.apk

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgroYar-Android10Plus-smoke-api-${{ matrix.api-level }}
          path: build/smoke
          if-no-files-found: ignore
