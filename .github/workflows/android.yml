name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate database assets
        run: python3 tools/validate_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Lint, test, and build compatibility release APK
        run: gradle :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Verify APK structure, manifest, signing, and native independence
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -tq "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          VERIFY_OUTPUT="$($APKSIGNER verify --verbose --print-certs "$APK")"
          echo "$VERIFY_OUTPUT"
          echo "$VERIFY_OUTPUT" | grep -q 'Verified using v1 scheme.*true'
          echo "$VERIFY_OUTPUT" | grep -q 'Verified using v2 scheme.*true'
          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | head -30
          echo "$BADGING" | grep -q "package: name='ir.agroyar.mobile'"
          echo "$BADGING" | grep -q "versionCode='4'"
          echo "$BADGING" | grep -q "versionName='0.3.0'"
          echo "$BADGING" | grep -q "sdkVersion:'21'"
          if unzip -l "$APK" | grep -q ' lib/.*\.so'; then
            echo "Unexpected native libraries found in compatibility APK" >&2
            unzip -l "$APK" | grep ' lib/.*\.so' >&2
            exit 1
          fi
          sha256sum "$APK"

      - name: Upload compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: AgroYar-0.3.0-compatibility-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 21
            arch: x86
          - api-level: 23
            arch: x86_64
          - api-level: 35
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: AgroYar-0.3.0-compatibility-apk
          path: artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and exercise AgroYar from launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: ${{ matrix.arch }}
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator_smoke_test.sh artifacts/app-release.apk

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgroYar-compat-smoke-api-${{ matrix.api-level }}
          path: build/smoke
          if-no-files-found: ignore
